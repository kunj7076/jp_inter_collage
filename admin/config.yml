backend:
  name: git-gateway
  branch: main

# Uploaded images kahan save hongi
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. Notice Board Management
  - name: "notices"
    label: "Notice Board (सूचनाएं)"
    folder: "_data/notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Notice Title (सूचना का शीर्षक)", name: "title", widget: "string" }
      - { label: "Date (तारीख)", name: "date", widget: "datetime" }
      - { label: "Urgent/Latest?", name: "urgent", widget: "boolean", default: true }
      - { label: "Notice Details (विवरण)", name: "body", widget: "markdown" }

  # 2. Photo Gallery Management
  - name: "gallery"
    label: "Photo Gallery (फोटो गैलरी)"
    folder: "_data/gallery"
    create: true
    fields:
      - { label: "Event Title (कार्यक्रम का नाम)", name: "title", widget: "string" }
      - { label: "Category (वर्ग)", name: "category", widget: "select", options: ["Sports Day", "Science Fair", "Cultural Fest", "Campus"] }
      - { label: "Photo Upload (फोटो चुनें)", name: "image", widget: "image" }

  # 3. Principal Message & Contact Info
  - name: "settings"
    label: "College Details (मुख्य विवरण)"
    files:
      - file: "_data/general.json"
        label: "General Settings"
        name: "general"
        fields:
          - { label: "Helpline Phone", name: "phone", widget: "string" }
          - { label: "Official Email", name: "email", widget: "string" }
          - { label: "Principal's Message", name: "principal_message", widget: "text" }
