<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login | JP Inter College Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* CMS area shuru me hide rahega */
    #nc-root {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center font-sans antialiased text-slate-800">

  <!-- 1. SIMPLE STAFF LOGIN BOX -->
  <div id="loginBox" class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4 border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-slate-900 text-amber-400 rounded-full flex items-center justify-center text-2xl font-bold mx-auto mb-3 shadow-md border-2 border-amber-400">
        JP
      </div>
      <h2 class="text-xl font-bold text-slate-900">Staff Portal Login</h2>
      <p class="text-xs text-slate-500 mt-1">जय प्रकाश इंटर कॉलेज • अधिकृत स्टाफ हेतु</p>
    </div>

    <!-- Error Message Area -->
    <div id="loginError" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg mb-4 text-center font-medium">
      <i class="fa-solid fa-circle-exclamation mr-1"></i> गलत Email या Password!
    </div>

    <form id="staffLoginForm" onsubmit="handleStaffLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Staff Email ID</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="email" id="staffEmail" required placeholder="admin@jpcollege.in" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Staff Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-sm"></i>
          <input type="password" id="staffPass" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
        </div>
      </div>

      <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-lg shadow-lg text-sm transition">
        Login to Dashboard
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <a href="/" class="text-xs text-slate-500 hover:text-slate-900 font-medium">
        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Main Website
      </a>
    </div>
  </div>

  <!-- 2. DECAP CMS SCRIPT (Login Success par trigger hoga) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- 3. LOGIN VALIDATION JAVASCRIPT -->
  <script>
    // === STAFF LOGIN CREDENTIALS (Aap yahan badal sakte hain) ===
    const VALID_EMAIL = "admin@jpcollege.in";
    const VALID_PASS = "Jp@Admin2026";

    // Check karein agar pehle se login session active hai
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('isStaffLoggedIn') === 'true') {
        unlockCMS();
      }
    });

    function handleStaffLogin(e) {
      e.preventDefault();
      const email = document.getElementById('staffEmail').value.trim();
      const pass = document.getElementById('staffPass').value.trim();
      const errorBox = document.getElementById('loginError');

      if (email === VALID_EMAIL && pass === VALID_PASS) {
        sessionStorage.setItem('isStaffLoggedIn', 'true');
        unlockCMS();
      } else {
        errorBox.classList.remove('hidden');
      }
    }

    function unlockCMS() {
      // Login form ko gayab karke CMS Dashboard show karein
      document.getElementById('loginBox').style.display = 'none';
      document.body.classList.remove('bg-slate-900', 'min-h-screen', 'flex', 'items-center', 'justify-center');
      document.body.style.background = '#f1f5f9';
      
      const cmsRoot = document.getElementById('nc-root');
      if (cmsRoot) {
        cmsRoot.style.display = 'block';
      }
    }
  </script>
</body>
</html>
